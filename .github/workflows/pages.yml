name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 22 is the current LTS runtime supported by this Next.js app.
          node-version: "22"
          cache: npm
          cache-dependency-path: public-frontend/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next
      - name: Install dependencies
        run: cd 'public-frontend' && npm ci
      - name: Build with Next.js
        run: cd 'public-frontend' && npx --no-install next build
      - name: Static HTML export with Next.js
        run: cd 'public-frontend' && npx --no-install next export
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public-frontend/out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
